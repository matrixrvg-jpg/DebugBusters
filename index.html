<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Load Auditor</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-900 text-gray-100 min-h-screen p-6 font-sans">

<div class="max-w-5xl mx-auto space-y-6">

    <header class="text-center mb-8">
        <h1 class="text-4xl font-bold text-emerald-400 mb-2">Phantom Load Auditor</h1>
        <p class="text-gray-400">Track, rank, and eliminate household energy waste.</p>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <!-- LEFT PANEL -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">

            <h2 class="text-xl font-semibold mb-4">Add Appliance</h2>

            <select id="room" onchange="updateApplianceDropdown()" class="w-full p-2 bg-gray-700 rounded mb-3">
                <option>Living Room</option>
                <option>Bedroom</option>
                <option>Kitchen</option>
                <option>Study</option>
            </select>

            <select id="applianceName" onchange="updateDefaultHours()" class="w-full p-2 bg-gray-700 rounded mb-3"></select>

            <input id="activeHours" type="number" placeholder="Hours/day" class="w-full p-2 bg-gray-700 rounded mb-3">

            <label class="flex items-center space-x-2 mb-3">
                <input type="checkbox" id="standbyToggle" checked>
                <span>Leaves on standby</span>
            </label>

            <button onclick="addAppliance()" class="w-full bg-emerald-500 p-2 rounded">+ Add Device</button>

            <hr class="my-4 border-gray-600">

            <input id="rate" type="number" value="8" class="w-full p-2 bg-gray-700 rounded mb-3">

            <button onclick="runAudit()" class="w-full bg-blue-500 p-3 rounded">Run Audit</button>
        </div>

        <!-- RIGHT PANEL -->
        <div class="lg:col-span-2 space-y-6">

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">
                <div class="bg-gray-800 p-4 rounded">
                    <p>Total Devices</p>
                    <p id="val-count">0</p>
                </div>
                <div class="bg-gray-800 p-4 rounded">
                    <p>Yearly Cost</p>
                    <p id="val-cost">₹0</p>
                </div>
                <div class="bg-gray-800 p-4 rounded">
                    <p>Phantom Waste</p>
                    <p id="val-phantom">₹0</p>
                </div>
                <div class="bg-gray-800 p-4 rounded">
                    <p>CO₂</p>
                    <p id="val-co2">0</p>
                </div>
            </div>

            <div id="offendersList" class="bg-gray-800 p-4 rounded">
                <p>Run audit to see results</p>
            </div>

            <div id="swapsList" class="bg-gray-800 p-4 rounded">
                <p>No recommendations yet</p>
            </div>

            <div class="bg-gray-800 p-4 rounded">
                <select id="simSelect" class="bg-gray-700 p-2 rounded"></select>
                <button onclick="runSimulation()" class="bg-blue-500 p-2 rounded ml-2">Simulate</button>
            </div>

        </div>

    </div>
</div>

<script>

const catalogMap = {
    "Living Room": ["Smart TV", "Set-Top Box", "Gaming Console"],
    "Study": ["Desktop Monitor", "Phone Charger"],
    "Kitchen": ["Old Refrigerator", "Microwave"],
    "Bedroom": ["Incandescent Bulb (60W)"]
};

const defaultHoursMap = {
    "Smart TV": 4, "Set-Top Box": 4, "Gaming Console": 2,
    "Desktop Monitor": 6, "Phone Charger": 2,
    "Old Refrigerator": 24, "Microwave": 1,
    "Incandescent Bulb (60W)": 5
};

let myInventory = [];

// Dropdown setup
function updateApplianceDropdown() {
    const room = document.getElementById('room').value;
    const dropdown = document.getElementById('applianceName');

    dropdown.innerHTML = '';

    catalogMap[room].forEach(app => {
        let opt = document.createElement('option');
        opt.value = app;
        opt.text = app;
        dropdown.appendChild(opt);
    });

    updateDefaultHours();
}

function updateDefaultHours() {
    const appliance = document.getElementById('applianceName').value;
    document.getElementById('activeHours').value = defaultHoursMap[appliance] || 1;
}

document.addEventListener("DOMContentLoaded", updateApplianceDropdown);

// Add device
function addAppliance() {

    const hours = parseFloat(document.getElementById('activeHours').value);

    if (isNaN(hours)) {
        alert("Enter valid hours");
        return;
    }

    const device = {
        id: Date.now().toString(),
        room: document.getElementById('room').value,
        name: document.getElementById('applianceName').value,
        is_custom: false,
        active_hours_per_day: hours,
        stays_on_standby: document.getElementById('standbyToggle').checked
    };

    myInventory.push(device);

    document.getElementById('val-count').innerText = myInventory.length;

    let opt = document.createElement('option');
    opt.value = device.id;
    opt.text = `${device.name} (${device.room})`;

    document.getElementById('simSelect').appendChild(opt);
}

// Run audit
async function runAudit() {

    if (myInventory.length === 0) {
        alert("Add devices first");
        return;
    }

    const rate = parseFloat(document.getElementById('rate').value) || 8;

    try {
        const res = await fetch('/api/audit', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({rate_per_kwh: rate, appliances: myInventory})
        });

        const data = await res.json();

        document.getElementById('val-cost').innerText = `₹${data.summary.yearly_cost}`;
        document.getElementById('val-co2').innerText = `${data.summary.yearly_co2} kg`;

        let phantom = data.all_data.reduce((s, x) => s + x.phantom_waste, 0);
        document.getElementById('val-phantom').innerText = `₹${phantom.toFixed(2)}`;

        let off = document.getElementById('offendersList');
        off.innerHTML = '';

        data.top_offenders.forEach(o => {
            off.innerHTML += `<p>${o.name} - ₹${o.yearly_cost}</p>`;
        });

        let swap = document.getElementById('swapsList');
        swap.innerHTML = '';

        data.recommendations.forEach(r => {
            swap.innerHTML += `<p>${r.message}</p>`;
        });

    } catch (err) {
        alert("Backend not running or error occurred");
    }
}

// Simulation
async function runSimulation() {

    const id = document.getElementById('simSelect').value;

    if (!id) {
        alert("Select device");
        return;
    }

    const device = myInventory.find(d => d.id === id);
    const rate = parseFloat(document.getElementById('rate').value) || 8;

    try {
        const res = await fetch(`/api/simulate?rate_per_kwh=${rate}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify(device)
        });

        const data = await res.json();

        alert(`${data.scenario}\nSavings: ₹${data.savings_rs} | ${data.savings_co2} kg CO₂`);

    } catch {
        alert("Simulation failed");
    }
}

</script>

</body>
</html>
